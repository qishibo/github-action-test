name: build_appx

on:
  workflow_dispatch:
    inputs:
      select_branch:
        description: select build branch
        default: appx
        type: choice
        options:
          - appx
          - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.select_branch }}
          fetch-depth: 0

      # 关键：安装Windows原生模块编译依赖（python + msvc编译工具）
      - name: Install Windows Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'
          cache: 'npm'

      # Windows PowerShell 获取tag
      - name: Get latest tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) { $tag = "unknown" }
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Print info
        shell: pwsh
        run: |
          git branch --show-current
          # echo "构建分支：$(${{ github.event.inputs.select_branch }})"
          echo "Node版本：$(node -v)"
          echo "当前Tag版本：$env:VERSION"

      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 配置npm全局编译参数，指定msvc版本，兼容node14
          npm config set msvs_version 2019
          npm ci
          npm run pack:prepare
          npm run pack:appx
