name: build_appx

on:
  workflow_dispatch:
    inputs:
      select_branch:
        description: select build branch
        default: appx
        type: choice
        options:
          - appx
          - master

jobs:
  build:
    runs-on: windows-2019 # 关键：切换内置VS2019镜像

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.select_branch }}
          fetch-depth: 0

      # 加载VS2019 C++编译环境
      - name: Enable MSVC VS2019
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29

      - name: Setup Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'
          cache: 'npm'

      # 提取版本Tag
      - name: Get latest tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) { $tag = "unknown" }
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Print info
        shell: pwsh
        run: |
          git branch --show-current
          echo "Node版本：$(node -v)"
          echo "当前Tag版本：$env:VERSION"

      # 正常编译原生模块，不再报gyp错误
      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm config set msvs_version 2019
          npm ci
          npm run pack:prepare
          npm run pack:appx

      # 1. 工作流制品，页面直接下载
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appx-build-${{ env.VERSION }}
          path: dist/*.appx # 修改为你的appx输出目录

      # 2. 自动发布GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            自动构建发布
            分支：${{ github.event.inputs.select_branch }}
            提交哈希：${{ github.sha }}
          files: dist/*.appx
          overwrite: true
