name: build_appx

on:
  workflow_dispatch:
    inputs:
      select_branch:
        description: select build branch
        default: appx
        type: choice
        options:
          - appx
          - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.select_branch }}
          fetch-depth: 0

      # 加载系统自带VS2022编译环境
      - name: Load MSVC Compiler Env
        uses: ilammy/msvc-dev-cmd@v1

      # 切换Node16.x
      - name: Setup Node.js 16.x
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'
          cache: 'npm'

      # 提取Tag版本号 PowerShell
      - name: Get latest tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) { $tag = "unknown" } 
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Print build info
        shell: pwsh
        run: |
          git branch --show-current
          echo "Node版本：$(node -v)"
          echo "当前Tag版本：$env:VERSION"

      # 正常编译原生模块，不再屏蔽ssh2/cpu-features
      - name: Install & Build Appx
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # node16+自动识别VS2022，无需写死msvs_version
          npm ci
          npm run pack:prepare
          npm run pack:appx

      # 1. 工作流临时制品下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appx-build-${{ env.VERSION }}
          path: dist/*.appx # 替换为你的打包输出目录

      # 2. 自动创建GitHub Release并上传安装包
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            构建环境：Windows-latest + Node16
            构建分支：${{ github.event.inputs.select_branch }}
            提交哈希：${{ github.sha }}
          files: dist/*.appx
          overwrite: true
